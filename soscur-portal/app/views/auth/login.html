<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOSCUR Portal — Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../public/css/prototipo.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-soscur">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="bi bi-mortarboard-fill"></i> SOSCUR Portal</a>
      <div class="ms-auto">
        <a href="../index.html" class="btn btn-outline-secondary btn-sm me-2">Volver al inicio</a>
        <a href="register.html" class="btn btn-primary-soscur btn-sm">Registrarse</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="auth-box card border shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1">Iniciar sesión</h4>
        <p class="text-muted small mb-4">Accede a tu cuenta de SOSCUR</p>
        <form onsubmit="window.location.href='../dashboard/estudiante.html'; return false;">
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="rec">
            <label class="form-check-label" for="rec">Recordarme</label>
          </div>
          <button class="btn btn-primary-soscur w-100">Entrar</button>
        </form>
        <p class="text-center small mt-3 mb-0">
          ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
