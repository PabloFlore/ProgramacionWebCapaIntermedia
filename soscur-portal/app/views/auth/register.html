<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOSCUR Portal — Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../public/css/prototipo.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-soscur">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="bi bi-mortarboard-fill"></i> SOSCUR Portal</a>
      <div class="ms-auto">
        <a href="../index.html" class="btn btn-outline-secondary btn-sm me-2">Volver al inicio</a>
        <a href="login.html" class="btn btn-primary-soscur btn-sm">Iniciar sesión</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="auth-box card border shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1">Crear cuenta</h4>
        <p class="text-muted small mb-4">Únete como estudiante o instructor</p>

        <form onsubmit="window.location.href='../dashboard/estudiante.html'; return false;">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre completo</label>
              <input class="form-control" placeholder="Nombre y apellidos" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Género</label>
              <select class="form-select">
                <option>Femenino</option>
                <option>Masculino</option>
                <option>Prefiero no decirlo</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Foto de perfil</label>
              <input type="file" class="form-control" accept="image/*">
            </div>
            <div class="col-12">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Confirmar contraseña</label>
              <input type="password" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label d-block">Rol inicial</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="rol" id="rol1" checked>
                <label class="form-check-label" for="rol1"><i class="bi bi-person-video3"></i> Estudiante</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="rol" id="rol2"
                  onchange="document.querySelector('form').onsubmit=function(){window.location.href='../dashboard/instructor.html';return false;}">
                <label class="form-check-label" for="rol2"><i class="bi bi-easel"></i> Instructor</label>
              </div>
            </div>
            <div class="col-12">
              <button class="btn btn-primary-soscur w-100">Crear cuenta</button>
            </div>
          </div>
        </form>

        <p class="text-center small mt-3 mb-0">
          ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
