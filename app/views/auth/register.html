<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOSCUR Portal — Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../public/css/prototipo.css" rel="stylesheet">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-soscur">
      <div class="container">
        <a class="navbar-brand" href="../index.html"><i class="bi bi-mortarboard-fill"></i> SOSCUR Portal</a>
        <div class="ms-auto">
          <a href="../index.html" class="btn btn-outline-secondary btn-sm me-2">Volver al inicio</a>
          <a href="login.html" class="btn btn-primary-soscur btn-sm">Iniciar sesión</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="auth-box card border shadow-sm">
        <div class="card-body p-4">
          <h4 class="fw-bold mb-1">Crear cuenta</h4>
          <p class="text-muted small mb-4">Únete como estudiante o instructor</p>

          <form id="formRegistro">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Nombre completo</label>
                <input class="form-control" placeholder="Nombre y apellidos" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Género</label>
                <select class="form-select">
                  <option>Femenino</option>
                  <option>Masculino</option>
                  <option>Prefiero no decirlo</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label">Foto de perfil</label>
                <input type="file" class="form-control" accept="image/*">
              </div>
              <div class="col-12">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input type="password" id="pass1" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" id="pass2" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label d-block">Rol inicial</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="rol" id="rol1" value="estudiante" checked>
                  <label class="form-check-label" for="rol1"><i class="bi bi-person-video3"></i> Estudiante</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="rol" id="rol2" value="instructor">
                  <label class="form-check-label" for="rol2"><i class="bi bi-easel"></i> Instructor</label>
                </div>
              </div>
              <div class="col-12">
                <button type="button" id="btnCrearCuenta" class="btn btn-primary-soscur w-100">Crear cuenta</button>
              </div>
            </div>
          </form>

          <p class="text-center small mt-3 mb-0">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Validación embebida directamente en la vista -->
    <script>
      document.getElementById("btnCrearCuenta").addEventListener("click", function () {
        const regForm = document.getElementById("formRegistro");
        const inputs = regForm.querySelectorAll("input[required]");
        
        // Validar campos vacíos
        for (let inp of inputs) {
          if (!inp.value.trim()) {
            alert("Por favor completa todos los campos obligatorios.");
            inp.focus();
            return;
          }
        }

        const pass1 = document.getElementById("pass1").value;
        const pass2 = document.getElementById("pass2").value;

        // Regex exigido por la rúbrica (8 caracteres, 1 mayúscula, 1 número, 1 carácter especial)
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,}$/;

        if (!regex.test(pass1)) {
          alert("La contraseña debe tener al menos 8 caracteres, una mayúscula, un número y un carácter especial (ej. @$!%*?&.#_-).");
          document.getElementById("pass1").focus();
          return;
        }

        if (pass1 !== pass2) {
          alert("Las contraseñas no coinciden.");
          document.getElementById("pass2").focus();
          return;
        }

        // Redirección
        const isInstructor = document.getElementById("rol2").checked;
        if (isInstructor) {
          window.location.href = "../dashboard/instructor.html";
        } else {
          window.location.href = "../dashboard/estudiante.html";
        }
      });
    </script>
  </body>
</html>
